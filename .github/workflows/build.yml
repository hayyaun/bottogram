name: Build test artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bottogram-build-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install native build compiler
        run: sudo apt-get update && sudo apt-get install -y clang
      - run: flutter analyze --no-pub
      - name: Test release artifact validation
        run: python3 -m unittest discover -s tool/ci -p test_prepare_release.py -v
      # Real external services remain opt-in; native flows use fixtures below.
      - run: flutter test --no-pub --concurrency=2

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      # Flutter/Gradle provisions the project's SDK and pinned NDK automatically.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          BOTTOGRAM_KEYSTORE_BASE64: ${{ secrets.BOTTOGRAM_KEYSTORE_BASE64 }}
          BOTTOGRAM_KEYSTORE_PASSWORD: ${{ secrets.BOTTOGRAM_KEYSTORE_PASSWORD }}
          BOTTOGRAM_KEY_ALIAS: ${{ secrets.BOTTOGRAM_KEY_ALIAS }}
          BOTTOGRAM_KEY_PASSWORD: ${{ secrets.BOTTOGRAM_KEY_PASSWORD }}
        run: bash tool/ci/build_android.sh trusted
      - name: Build release-mode APK with a temporary PR validation key
        if: github.event_name == 'pull_request'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash tool/ci/build_android.sh pull-request
      - name: Verify release APK is not debuggable
        run: test "$(apkanalyzer manifest debuggable build/app/outputs/flutter-apk/app-release.apk)" = 'false'
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/bottogram-android-release.apk
          cd dist
          sha256sum bottogram-android-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.event_name == 'pull_request' && 'bottogram-android-pr-validation' || 'bottogram-android-release' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android-sqlite-isolation:
    name: Android SQLite isolation
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      # Flutter/Gradle provisions the project's SDK and pinned NDK automatically.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable emulator KVM access on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-bottogram-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::The runner cannot access /dev/kvm after udev processing completed.'
            exit 1
          fi
      - name: Test Android SQLite isolation, templates, and background execution
        timeout-minutes: 30
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: bottogram-sqlite-isolation
          ndk: 28.2.13676358
          emulator-port: 5554
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            timeout 20m flutter test integration_test/sqlite_isolation_test.dart -d emulator-5554 --no-pub --reporter expanded
            timeout 20m flutter test integration_test/templates_test.dart -d emulator-5554 --no-pub --reporter expanded
            timeout 10m flutter test integration_test/background_service_test.dart -d emulator-5554 --no-pub --reporter expanded
      # The action also stops its emulator on success and failure. Keep a bounded
      # cleanup step for cancellation or an interrupted action process.
      - name: Stop the disposable emulator
        if: always()
        run: timeout 15s adb -s emulator-5554 emu kill || true

  windows:
    name: Windows EXE bundle
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub --verbose
      - name: Probe released Windows SQLite libraries
        run: python tool/ci/verify_sqlite_bundle.py build/windows/x64/runner/Release
      - name: Test packaged Windows SQLite isolation
        run: flutter test integration_test/sqlite_isolation_test.dart -d windows --no-pub --reporter expanded
      - name: Test packaged Windows bot templates
        run: flutter test integration_test/templates_test.dart -d windows --no-pub --reporter expanded
      - name: Package EXE with its runtime files
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$bundle/bottogram.exe")) { throw 'Windows executable is missing.' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath dist/bottogram-windows-x64.zip
          $digest = (Get-FileHash dist/bottogram-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  bottogram-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bottogram-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build and test Windows installer
        shell: pwsh
        run: ./tool/ci/package_windows_installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bottogram-windows-x64-installer
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS native checks (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            publish: true
          - runner: macos-15-intel
            arch: x64
            publish: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Test macOS credential storage
        run: flutter test integration_test/secret_vault_test.dart -d macos --no-pub --reporter expanded --verbose
      - name: Test packaged macOS SQLite isolation
        run: flutter test integration_test/sqlite_isolation_test.dart -d macos --no-pub --reporter expanded --verbose
      - name: Test packaged macOS bot templates
        run: flutter test integration_test/templates_test.dart -d macos --no-pub --reporter expanded --verbose
      - run: flutter build macos --release --no-pub
      - name: Probe released macOS SQLite frameworks
        run: python3 tool/ci/verify_sqlite_bundle.py build/macos/Build/Products/Release/bottogram.app/Contents/Frameworks
      - name: Package universal macOS app
        if: matrix.publish
        run: bash tool/ci/package_macos.sh
      - name: Collect macOS startup diagnostics
        if: failure()
        run: bash tool/ci/collect_macos_diagnostics.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: bottogram-macos-diagnostics-${{ matrix.arch }}
          path: build/verification/macos-diagnostics
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.publish
        with:
          name: bottogram-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppImage
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libfuse2 patchelf desktop-file-utils xvfb
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Test packaged Linux SQLite isolation
        run: xvfb-run -a flutter test integration_test/sqlite_isolation_test.dart -d linux --no-pub --reporter expanded
      - name: Test packaged Linux bot templates
        run: xvfb-run -a flutter test integration_test/templates_test.dart -d linux --no-pub --reporter expanded
      - run: flutter build linux --release --no-pub
      - name: Probe released Linux SQLite libraries
        run: python3 tool/ci/verify_sqlite_bundle.py build/linux/x64/release/bundle/lib
      - name: Package AppImage
        run: bash tool/ci/package_appimage.sh
      # tar preserves the executable bit through Actions' ZIP artifact storage.
      - name: Preserve AppImage permissions and record checksum
        run: |
          cd dist
          sha256sum bottogram-linux-x86_64.AppImage > SHA256SUMS.txt
          tar -czf bottogram-linux-x86_64.AppImage.tar.gz bottogram-linux-x86_64.AppImage SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bottogram-linux-x86_64
          path: dist/bottogram-linux-x86_64.AppImage.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Build and verify headless Linux CLI
        run: |
          dart build cli --target bin/bottogram.dart --output build/headless
          mkdir -p dist-cli
          tar -C build/headless -czf dist-cli/bottogram-cli-linux-x86_64.tar.gz bundle
          smoke="$(mktemp -d)"
          trap 'rm -rf -- "$smoke"' EXIT
          tar -xzf dist-cli/bottogram-cli-linux-x86_64.tar.gz -C "$smoke"
          cp examples/headless/config/hello.bottogram-plugin.json "$smoke/"
          jq '.tokenFile = "bot_token"' examples/headless/config/bot.json > "$smoke/bot.json"
          printf '%s\n' '99:release_fixture' > "$smoke/bot_token"
          "$smoke/bundle/bin/bottogram" validate --config "$smoke/bot.json"
          (cd dist-cli && sha256sum bottogram-cli-linux-x86_64.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bottogram-cli-linux-x86_64
          path: dist-cli/*
          if-no-files-found: error
          retention-days: 14
